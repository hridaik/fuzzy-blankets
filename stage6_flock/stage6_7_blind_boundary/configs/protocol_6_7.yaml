# PROTOCOL_6_7 -- frozen AFTER the firewall test (tests/test_no_topology_leakage.py,
# 16/16 passing) and the timing pilot (logs/timing_pilot.json) ran, and AFTER
# the edge-stability threshold (tau_freq, tau_sign) was chosen from seeds 2/3's
# BLIND bootstrap statistics only (no topology consulted for that choice --
# see "edge_stability" below), BEFORE seed 4 or any oracle_validation.py
# comparison was computed. Do not edit this file after viewing oracle-reveal
# numbers. See PLAN.md for the scope decisions made before any code ran.

reused_unmodified_from_stage6:
  simulator: python/flock_sim/*
  control_hook: python/flock_sim/interventions.py:make_pulse
  flock_discovery: v2_interface_control/code/common_v2.py:find_flock
  evaluate_arm: v2_interface_control/code/common_v2.py:evaluate_arm
  T_u: 20
  T_r: 20
  beta_rho_omega: [1.0, 15.0, 3.0]

reused_unmodified_from_stage6_5:
  predictive_model: stage6_5/boundary_inference/code/nodewise_model.py:NodewiseModel,design_matrix,flatten_transitions
  estimator_hyperparameters: {solver: liblinear, penalty: l2, C: 1.0, max_iter: 200}
  greedy_selection: stage6_5/boundary_inference/code/greedy_selection.py:fit_eval,greedy_forward_select
  exact_counterfactual_propagator: stage6_5/refinement/causal_redundancy/code/exact_intervention.py

reused_unmodified_from_stage6_6:
  archetype_conditions: stage6_6_collective_landscape/code/archetypes.py:build_condition,CONDITIONS
  replicate_generation: stage6_6_collective_landscape/code/windowed_data.py:run_condition_replicates
  reference_I0_resize: stage6_6_collective_landscape/code/common_66.py:resize_to_k
  candidate_landbank_source: "stage6_6_collective_landscape/data/seed{2,3,4}__{condition}__fE1.00__t20.json (5000 candidates/snapshot, read-only)"
  k_interior: 20
  K_boundary_budget_precedent: 12   # this stage's own K_max reuses the same cap for comparability (task brief section 6)

the_firewall:
  statement: "Inference code may see trajectories and interventions, but not topology."
  inference_side_modules: [blind_cache.py, directed_graph_inference.py, graph_bootstrap.py,
                            predictive_boundary.py, causal_discovery.py]
  evaluation_side_modules: [common_67.py, candidate_panel.py, intervention_api.py,
                             oracle_validation.py, blind_landscape.py, run_*.py drivers]
  enforcement: tests/test_no_topology_leakage.py (AST import/identifier/signature scan + runtime Lattice-instance seal)
  only_module_permitted_to_reveal_true_graph: oracle_validation.py

primary_objects:
  W_window: 10
  R_replicates: 100
  primary_seeds: [2, 3, 4]
  conditions: [no_control, shell_only, same_direction, opposite, disordered]
  n_snapshots: 15
  candidates_per_snapshot: 20
  total_primary_candidates: 300

data_split:
  train_val_test_fractions: [0.6, 0.2, 0.2]
  split_level: replicate   # never timestep -- no future leakage, task brief section 2
  split_seed: 0

directed_graph_inference:
  shortlist_k: 25   # matches stage6_5/boundary_inference/code/api.py's own default
  criterion: "coefficient-based shortlist (sum |coef| over the source bird's 4 one-hot columns, all fitted class rows), then leave-one-out Delta on the shortlist only -- non-shortlisted pairs get Delta=0 exactly (disclosed, task brief section 4)"

edge_stability:
  B_boot: 30
  tau_freq: 0.5
  tau_sign: 0.7
  rule: "stable(i<-j) <=> selection_frequency >= tau_freq AND sign_stability >= tau_sign"
  freeze_process: >
    Thresholds were chosen by examining ONLY the blind bootstrap statistics
    (selection_frequency, sign_stability histograms over every (i,j) edge
    ever shortlisted at least once in 30 boots) on seed 2's no_control
    snapshot -- never the true graph. The histogram showed a clear tail
    (selection_frequency>=0.9 cluster of 176/1407 edges) separated from a
    long low-frequency tail of edges shortlisted only sporadically; tau_freq
    (majority of boots positive) and tau_sign=0.7 (dominant sign consistent
    in >=70% of boots, a materially stronger requirement than tau_freq alone
    once zero-Delta boots are accounted for) were picked as a principled,
    non-oracle-informed cut and then FROZEN and applied unchanged to every
    snapshot, seed 4 included -- never re-tuned after any oracle_validation.py
    comparison ran.

predictive_boundary:
  delta_tol: 0.01     # == delta_pred, task brief section 7's boxed value, reused for the greedy stopping rule too
  min_gain: 0.002      # matches stage6_5/boundary_inference/code/api.py's own default
  max_size: 12         # K_max, task brief section 6; never forces Bhat to this size
  delta_pred_test_criterion: 0.01   # nats/bird-step, task brief section 7

causal_discovery:
  n_states_per_candidate: 15   # observed states sampled per candidate for the do() sweep
  ci_n_boot: 1000               # cheap: resamples ALREADY-COLLECTED per-state KL samples, no new oracle calls
  ci_alpha: 0.05
  criterion: "Bhat^causal(I) = {j : bootstrap CI lower bound on D_j^do > 0}"

sample_efficiency_sweep:
  r_grid: [5, 10, 20, 50, 100]
  condition: no_control
  n_candidates_per_seed: 6   # established I0 + 5 more panel candidates
  scope_reduction: >
    Single (non-bootstrapped) directed graph per (seed, R) point, raw Delta>0
    as the candidate-pool criterion -- bootstrapping the graph-inference
    procedure at R<=20 replicates (a 60% split leaves as few as 3 training
    replicates) is not statistically meaningful. This reduction applies ONLY
    to the sweep, never to the primary 300-candidate panel's frozen
    B_boot=30 bootstrap-stability numbers.

control_diagnostic:
  n_replicates: 30
  condition: no_control
  arms: [oracle, predictive, causal, random_matched_per_arm]
  note: "diagnostic only, no new controller optimization (task brief section 16)"
