# PROTOCOL_V2 — frozen BEFORE any V2 actuator-rule comparison or replication run.
#
# Everything below is either (a) copied unchanged from PROTOCOL_V1a
# (../../stage6_flock/PROTOCOL_V1.md, corrected per v1_mechanism_audit/V1_RECORD_AUDIT.md
# section A2) -- the model, spectral pipeline, and task success/integrity/
# persistence thresholds are NOT retuned -- or (b) derived directly from the
# mechanism audit (v1_mechanism_audit/MECHANISM_AUDIT_RESULTS.md), never from
# a V2 result. Do not edit this file after viewing any V2 comparison result.

model:  # unchanged from protocol_v1.yaml
  nn: 100
  nh: 8
  nu: 4
  vm: 4.0
  ca: 2.0
  fc: 1.0
  beta: 1.0
  precB: 15.0    # code_default regime (see mechanism audit Part G); manuscript_all_ones
  precC: 3.0     # is reported separately, never substituted silently.
  alpha: 8.0
  spm_beta: 4.0
  n_iter: 4

spectral:  # unchanged from protocol_v1.yaml
  TW: 5
  boundary_rule: fixed
  fixed_threshold: 0.05
  core_pctl: [80.0, 20.0]

selection_rule_phase2a:  # unchanged from protocol_v1.yaml -- used to find each
  # replication flock's own I0/t0/h0, exactly as in protocol_v1a.
  nt_search: 60
  eigengap_min: 1.0
  coherence_min: 0.90
  n_min: 10
  n_max: 30
  jaccard_min: 0.6
  stability_steps: 3

task:  # unchanged from protocol_v1.yaml
  T_u: 20
  T_r: 20
  success_threshold_Hstar: 0.8
  integrity_coherence_min: 0.8
  integrity_lineage_min: 0.5
  persistence_threshold_Hstar: 0.5

# --- Everything below is new to V2, derived from v1_mechanism_audit ---

control_interface:
  # The mechanism audit (Part B) established that a bird's next heading
  # depends ONLY on its lattice.neighbor_ids (Moore neighbors on the fixed,
  # non-moving 10x10 lattice). B^D_0(I0) is defined identically to the audit:
  # the set of non-I0 birds that are a Moore-lattice-neighbor of some I0
  # member. Because the lattice is time-invariant and I0 is frozen for the
  # duration of a control episode, B^D_t == B^D_0 for all t within an episode
  # (audit finding -- NOT an assumption). "Adaptive" in this protocol
  # therefore means "recomputed fresh, from structure, for EACH new flock" --
  # not "recomputed within a single episode's timesteps," which this port's
  # physics makes a non-distinction. This is stated plainly, not silently
  # narrowed, in RESULTS_V2.md.
  definition: "B^D_0(I0) = {j not in I0 : j in union_i(lattice.neighbor_ids[i]) for i in I0}"
  frozen_from: "v1_mechanism_audit/MECHANISM_AUDIT_RESULTS.md Part B, Part D interpretation gate"

actuator_budget:
  # Derived from v1_mechanism_audit/data/shell_sparsification.json: on the
  # canonical flock (|B^D_0|=12), a greedy search WITHIN the correct pool
  # first crosses p_success>=0.8 at k=9 (9/12 = 0.75 of the shell). Applied
  # here as a FIXED FRACTION, not a fixed absolute count, so it generalizes
  # across flocks whose shell size differs from the canonical 12:
  fraction_of_shell: 0.75
  k_formula: "k = ceil(0.75 * |B^D_0|)"
  note: >
    This fraction is derived from ONE flock (the canonical snapshot) and is
    explicitly being tested for generalization in the Part L replication --
    it is not re-derived per flock, and it is not adjusted after seeing
    replication results. If replication shows it under- or over-shoots
    systematically, that is reported as a finding, not silently corrected
    within this session.

actuator_selection_rules:
  # All four are run at the SAME budget k on the SAME set of replication
  # flocks, common random numbers within each flock.
  rule_A_degree: "the k members of B^D_0 with the most edges INTO I0 (ties broken by bird index)"
  rule_B_leverage: "the k members of B^D_0 with the highest individual k=1 empirical response (mean H*(t0+Tu) under solo forcing), ranked from a predeclared n=20-replicate sweep per flock"
  rule_C_patch: "a single BFS-connected patch of size k within B^D_0's own induced adjacency graph (on the lattice), seeded from the highest-degree member; if B^D_0 is not internally connected, the largest connected component is used first, then the next, until k is reached"
  rule_D_random: "k uniformly random members of B^D_0, no replacement (explicit control condition)"
  reference_arms: "k=|B^D_0| (full shell, from the mechanism audit) and k=0 (baseline) are also reported for context, not as competing 'rules'"

replication:
  n_flocks_target: 10
  selection: "the first 10 seeds (starting from 0, in numeric order) that satisfy selection_rule_phase2a within nt_search=60 -- not cherry-picked, not re-drawn if a flock is 'hard'"
  replicates_per_condition: 30   # development scale; logged as such, matching protocol_v1a's own transparency norm

integrity_criterion_status:
  # The mechanism audit (Part D) found P(success & integrity)=0.000 for EVERY
  # exterior-only control arm tested (including near-perfect target attainment
  # arms), because C_{I0}(t)>=0.8 at EVERY timestep of the control window
  # appears to conflict mechanistically with propagation-based (as opposed to
  # direct-override) steering, which passes through a transient partial
  # disagreement while the core re-converges on the new heading. This
  # protocol does NOT loosen integrity_coherence_min or
  # integrity_lineage_min -- both are carried forward UNCHANGED from
  # protocol_v1a. Instead, V2 reports success and success-and-integrity as
  # two clearly separate numbers throughout (never conflated), and explicitly
  # tests, as an additional diagnostic (not a replacement criterion), a
  # RECOVERY variant: "C_{I0}(t)>=0.8 at t0+T_u itself (end of control) and at
  # every t in a trailing recovery window [t0+T_u-3, t0+T_u]" -- reported
  # ALONGSIDE, never instead of, the original frozen criterion.
