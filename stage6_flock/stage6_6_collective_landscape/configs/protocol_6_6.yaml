# PROTOCOL_6_6 -- frozen AFTER the controlled-archetype sanity check
# (data/archetype_trajectories.json, seeds 2/3/4, conditions A-E, f_E sweep)
# ran and was qualitatively inspected (see METRIC_VALIDATION.md), BEFORE the
# full 5000-candidate-per-snapshot landscape (data/seed*__*.json) was
# generated for the interactive demo. Do not edit this file after viewing
# the full-landscape numbers. See PLAN.md for the scope decisions made
# before any code ran.

reused_unmodified_from_stage6:
  simulator: python/flock_sim/*
  control_hook: python/flock_sim/interventions.py:make_pulse
  control_semantics: python/flock_sim/active_inference.py:step (applied_action override, sampled through Bu)
  target_heading_rotation: python/flock_sim/model.py:rotate_cw / rotate_ccw
  flock_discovery: v2_interface_control/code/common_v2.py:find_flock
  structural_shell: v1_mechanism_audit/code/dynamical_shell.py:one_hop_neighbors (aliased structural_shell)
  graph_distance_shells: v1_mechanism_audit/code/dynamical_shell.py:k_hop_shell, graph_distance_from_set
  T_u: 20   # v2_interface_control/code/common_v2.py:T_U
  T_r: 20   # v2_interface_control/code/common_v2.py:T_R
  beta_rho_omega: [1.0, 15.0, 3.0]  # flock_sim.model.ModelParams defaults (beta, precB=rho, precC=omega)

reused_unmodified_from_stage6_5:
  predictive_model: stage6_5/boundary_inference/code/nodewise_model.py:NodewiseModel
  estimator_hyperparameters: {solver: liblinear, penalty: l2, C: 1.0, max_iter: 200}

primary_objects:
  k_interior: 20        # |I|, fixed for the primary experiment (task brief section 1)
  K_boundary_budget: 12  # matches |B^D_0(canonical I0)| exactly (dynamical_shell.json)
  W_window: 10           # local-regime window length, states
  R_replicates: 100      # paired common-random-number replicates per condition
  primary_seeds: [2, 3, 4]

reference_I0_per_seed:
  seed_2: {size_raw: 20, resize_needed: false}
  seed_3: {size_raw: 19, resize_needed: true, grown_by: 1}
  seed_4: {size_raw: 20, resize_needed: false}
  resize_method: "code/common_66.py:resize_to_k, connectivity-preserving grow/trim, same rule used for the spectral_resized candidate-generation method"

window_dataset:
  train_fraction: 0.7   # trajectory-level split of the R replicates (code/windowed_data.py:TRAIN_FRACTION)
  split_level: replicate  # never timestep -- task brief section 6's fold requirement
  split_seed: 0
  snapshot_timepoint: "t = t0 + T_u (control-end), task brief section 25"

candidate_generation:
  target_per_snapshot: 5000
  methods_and_quotas:
    region_growing: 0.35
    mcmc_swap: 0.25
    perturb_I0: 0.15
    high_coherence: 0.15
    spectral_resized: 0.10
  always_included: seed_reference_I0
  connectivity_repair: "spectral bases reduced to their largest connected component before resize_to_k (Fiedler bipartitions are graph cuts, not guaranteed spatially contiguous) -- code/common_66.py:largest_connected_component"

boundary_search:
  candidate_pool: "I's own structural shell S(I) only (simulator's known shell, evaluation-only use -- task brief section 10 explicitly permits this for a collective-characterization stage)"
  method: "greedy forward selection minimizing held-out L_I, then up to 2 passes of one-swap local refinement"
  boundary_size_rule: "|B| = min(K, |S(I)|); full shell used directly (no search) when |S(I)| <= K"

archetype_conditions:
  names: [no_control, shell_only, same_direction, opposite, disordered]
  maps_to_task_brief: {no_control: A, shell_only: B, same_direction: C, opposite: D, disordered: E}
  f_E_sweep: [0.25, 0.50, 0.75, 1.00]
  exterior_selection_rule: "deterministic farthest-point (max-min) selection over graph distance within E_near(I) -- code/archetypes.py:farthest_point_subset"
  disordered_schedule: "deterministic balanced rotating schedule, heading(rank,t) = (rank + t) mod 4 -- code/archetypes.py:balanced_rotating_targets"
  opposite_heading_rule: "geometric UV4 negation, verified equal to rotate_cw . rotate_cw -- code/archetypes.py:opposite_heading"

seed_offsets:
  note: "distinct replicate-RNG ranges per condition, disjoint from V1-V3/6.5's own offset ranges"
  no_control: 660000
  shell_only: 661000
  same_direction: 662000
  opposite: 663000
  disordered: 664000
  archetype_validation_extra_offset: 500000  # added on top of the per-condition base + round(f_E*1000)

pareto_filter:
  objectives_maximized: [C_internal, G_internal, "-L_blanket", D_local]
  role: "optional visualization/filter only -- never drives candidate generation or conclusions (task brief sections 8, 24)"

computational_budget_disposition:
  timing_pilot: "logs/timing_pilot notes in RESULTS_6_6.md; cost saturates near a fixed number of unique (bird, neighbour-mask) fits regardless of candidate count"
  outcome: "full 5000-candidate target achieved for all 15 primary snapshots (3 seeds x 5 conditions at f_E=1.0, control-end); recorded per-snapshot in data/snapshot_manifest.json"
