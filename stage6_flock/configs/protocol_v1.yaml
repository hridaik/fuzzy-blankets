# PROTOCOL_V1 — frozen BEFORE any control/actuator experiment was run.
#
# ENCODING-BUG ADDENDUM (post-freeze correction, applied before Phase 4/5):
# state indices {0:up,1:down,2:left,3:right} are NOT arranged as a rotational
# cycle. "Adjacent cardinal heading" (h_star) must be computed via the
# geometry-derived permutation flock_sim.model.ROT_CW (equivalently ROT_CCW),
# never via raw (h0+1) mod 4 arithmetic, which for some h0 yields the OPPOSITE
# (180-degree) heading instead of a 90-degree turn. This was caught via an
# anomalous Phase-3A positive-control baseline rate (32% spontaneous success
# where ~7% was expected) and fixed by re-deriving h_star geometrically,
# BEFORE any sparse-actuator search (Phase 4/5) was run. All numbers in this
# file already reflect the corrected definition. See PROTOCOL_V1.md section 1a
# and PORT_VALIDATION.md for the full account.
# Every numeric threshold below is either (a) copied from the upstream code's
# own defaults (see METHODS_AUDIT.md section 14), or (b) derived from the
# uncontrolled baseline ensemble in data/baseline_v1/ (300 replicates, seeds
# 0-299, nn=100, nt=60), which itself consulted no control outcome whatsoever.
# Do not edit this file after viewing control results. Any change requires a
# new protocol_v2.yaml with its own rationale.

model:
  nn: 100
  nh: 8
  nu: 4
  vm: 4.0
  ca: 2.0
  fc: 1.0
  beta: 1.0        # precAbird (code default; paper text claims 1 -- matches here)
  precB: 15.0       # rho (code default; paper text claims 1 -- DOES NOT match, using code)
  precC: 3.0        # omega (code default; paper text claims 1 -- DOES NOT match, using code)
  alpha: 8.0
  spm_beta: 4.0
  n_iter: 4

spectral:
  TW: 5                     # code default (getMarkovBlanketOfFlock.m)
  boundary_rule: fixed       # reproduces released code exactly (|y2|<0.05 abs, max-normalized)
  fixed_threshold: 0.05
  core_pctl: [80.0, 20.0]

selection_rule_phase2a:
  # Derived from data/baseline_v1 (300 uncontrolled replicates, nt=60):
  #   found rate 53.7%; t0 median=8 (range 4-57); |I0| median=20 (range 13-20);
  #   eigengap median=9.73 (min 1.12 among qualifiers); coherence min=0.900.
  nt_search: 60
  eigengap_min: 1.0
  coherence_min: 0.90
  n_min: 10
  n_max: 30
  jaccard_min: 0.6
  stability_steps: 3

canonical_snapshot:
  # Rule: smallest seed (starting at 0) for which the selection rule above
  # finds a qualifying t0 within nt_search=60. Seeds 0 and 1 did not qualify;
  # seed=2 is the first that does. This was determined by the baseline sweep
  # BEFORE any control code was written or run.
  seed: 2
  nt_total: 100   # extended beyond nt_search=60 purely for logistics (room for
                  # T_u + T_r after a possibly-late t0); trajectory for t<=60 is
                  # bit-identical to the nt_search=60 baseline run since the RNG
                  # stream is deterministic and sequential.
  t0: 41
  h0: 2            # left
  h_star: 0        # up -- rotate_cw(left); see model.ROT_CW. NOT (h0+1)%4=3 (right,
                   # a 180-degree flip, not a 90-degree turn) -- see the "encoding
                   # bug" note at the top of this file and PROTOCOL_V1.md section 1a.

task:
  # Spontaneous-attainment nontriviality check (data/baseline_v1, corrected
  # rotate_cw h_star, 300 replicates, 161 qualifying):
  #   Tu=10: P(Hstar>=0.8)=0.013 (n=157)
  #   Tu=20: P(Hstar>=0.8)=0.066 (n=151)   <-- chosen
  #   Tu=30: P(Hstar>=0.8)=0.110 (n=146)
  #   Tu=40: P(Hstar>=0.8)=0.154 (n=123)
  T_u: 20
  T_r: 20
  success_threshold_Hstar: 0.8
  integrity_coherence_min: 0.8       # C_I0(t) >= this for all t in [t0, t0+T_u]
  integrity_lineage_min: 0.5         # R_I(t0+T_u) >= this
  persistence_threshold_Hstar: 0.5   # weaker bar, at t0+T_u+T_r, post-release

probabilistic_success:
  p_min_for_actuator_acceptance: 0.5
  replicates_development: 50
  replicates_final_target: 200   # requested by task brief; actual counts used
                                  # are logged per-run in RESULTS_V1.md if fewer,
                                  # with the reason (compute/time budget) stated.

actuator_search:
  k1_exhaustive: true             # all birds not in I0
  shortlist_size_if_k1_fails: 10
  response_map_replicates: 30     # reduced from replicates_final_target for the
                                   # full non-interior sweep; documented tradeoff.
  response_map_pulse_duration: 20  # == T_u, so the map is diagnostic of the actual task
