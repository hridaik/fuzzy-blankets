# PROTOCOL_6_5 -- frozen AFTER the dev-flock sweep (data/dev_sweep.json,
# seeds 2,3,4, five delta_tol_frac values x N_train=100), BEFORE any
# held-out-flock number (Part 1.8-1.10), any sample-efficiency curve beyond
# what dev_sweep.json itself contains, any bootstrap membership run, or any
# controller comparison (Part 2). Do not edit this file after viewing
# held-out, bootstrap, or control-comparison results. See
# stage6_5/PROTOCOL_6_5.md for the full narrative and stage6_5/PLAN.md for
# the scope decisions made before this sweep ran.

reused_unmodified_from_stage6:
  simulator: python/flock_sim/*
  flock_discovery: v2_interface_control/code/common_v2.py:find_flock
  true_shell: v2_interface_control/code/common_v2.py:dynamical_shell
  dev_flock_pool_source: v3_refinement/code/common_v3.py:DEV_SEEDS
  held_out_flock_pool_source: v3_refinement/code/common_v3.py:find_held_out_flocks
  multicover_controller_law: v3_refinement/code/selection_rules_v3.py (q, gamma below)
  T_u: 20   # v2_interface_control/code/common_v2.py:T_U
  T_r: 20   # v2_interface_control/code/common_v2.py:T_R

flock_pool_scope:
  boundary_inference_dev_seeds: [2, 3, 4]          # first 3 of V3's frozen 10 dev seeds
  boundary_inference_held_out_seeds_n: 3            # first 3 of V3's frozen 6 held-out seeds
  sample_efficiency_curve_seed: 2                   # canonical flock only (within-flock diagnostic)

trajectory_generation:
  method: "pure baseline continuation from z_t0, no actuation, independent stochastic replicates"
  n_time_steps_per_trajectory: 15
  n_train: 100
  n_val: 30
  n_test: 30
  split_level: trajectory  # never timestep -- Part 1.2's leakage requirement
  seed_offset: 650000       # trajectory_gen.py:TRAJ_SEED_OFFSET

estimator:
  family: "nodewise regularized logistic regression, one classifier per interior bird"
  features: "one-hot(X_I0,t) concatenated with one-hot(X_B,t) for the current candidate set B"
  solver: liblinear   # switched from lbfgs after a dev-flock timing check: ~40x faster at
                       # this problem's scale (400 features / 1500 samples), held-out log-loss
                       # unchanged to 3 decimals (0.0932 vs 0.0936-0.0939) -- see
                       # boundary_inference/code/nodewise_model.py's NodewiseModel docstring
  penalty: l2
  C: 1.0
  max_iter: 200
  chosen_because: >
    Transparent, per Part 1.4's instruction to prefer a transparent model over
    deep networks; supports per-bird nodewise conditional prediction (Part
    1.3) so the union of nonzero per-(i,j) dependencies can double as a
    directed observational graph for Part 2; scales to this problem's
    dimensionality once liblinear replaced lbfgs as the solver (see above).

candidate_screening:
  shortlist_k: 20
  method: "single-candidate marginal held-out log-loss gain vs interior-only baseline"
  purpose: >
    Compute-feasibility step (Part 1.9's 'sample-size analysis') restricting
    greedy forward selection's per-step search to a shortlist, not a
    structural filter -- every exterior bird is screened once, none excluded
    a priori by position or identity.

greedy_forward_selection:
  stopping_rule: >
    delta_tol_frac / min_gain_frac, operationalizing Part 1.5's "delta
    relative to the full predictor" as a FRACTION of the total gap
    (interior_only_loss - full_loss) each flock's exterior closes, rather
    than a fixed absolute-nats threshold -- chosen after a first sweep
    (round 1, superseded, see PROTOCOL_6_5.md Appendix) used absolute nats
    (delta_tol in {0.005,0.01,0.02}) and found some dev flocks' total gap
    itself sits near the tested absolute values, making the threshold
    trivially satisfied at B=empty for one of three dev flocks regardless of
    which absolute value was tried. The relative formulation adapts to how
    much signal exists at all in a given flock.
  delta_tol_frac: 0.05
  min_gain_frac: 0.005      # = delta_tol_frac / MIN_GAIN_FRAC_DIVISOR(10)
  freeze_rule: >
    PRE-REGISTERED rule (chosen before any held-out number was computed):
    take the TIGHTEST delta_tol_frac in the tested grid
    {0.6, 0.4, 0.2, 0.1, 0.05} -- boundary recovery (Jaccard vs the true
    B^D, revealed on dev flocks only for this diagnostic) improved
    monotonically as the threshold tightened, with no sign of instability or
    excess-loss cost (excess loss stayed <=0.0008 nats on 2 of 3 dev flocks
    and 0.0006 on the third, at the tightest value tested). Do not
    extrapolate past the tested grid -- 0.05 is frozen because it is the
    tightest VALIDATED point, not because a hypothetical tighter value was
    assumed better.
  dev_sweep_evidence: "data/dev_sweep.json"
  dev_sweep_summary_at_frozen_value:
    seed_2: {size_hat: 7, jaccard_vs_BD: 0.58, excess_loss: 0.0006}
    seed_3: {size_hat: 3, jaccard_vs_BD: 0.21, excess_loss: -0.0002}
    seed_4: {size_hat: 3, jaccard_vs_BD: 0.18, excess_loss: 0.0008}

bootstrap:
  n_boot: 15
  scope_note: >
    Compute-scoped (Part 1.7's requirement is honored, at reduced replicate
    count) -- run on the canonical flock (seed 2) only, not every dev/held-out
    flock, consistent with this project's own "development scale" language
    for compute-bounded replicate counts (see stage6_flock/STAGE6_SYNTHESIS.md
    Limitations).
  resample_level: trajectory  # never timestep

null_baselines:
  fiedler_boundary: "flock_sim.spectral.analyze_window, refclust=I0, on a TW=5 window from a held-out test trajectory"
  random_matched_size:
    n_draws: 20
  full_exterior: "all 80 non-I0 birds jointly (the Delta-ell=0 reference)"
  oracle_shell: "B^D revealed only after B_hat is frozen"

control_comparison_part2:
  reused_frozen_v3_law: true
  q: 2      # v3_refinement/configs/protocol_v3.yaml: interface_control_law.q
  gamma: 0.5  # v3_refinement/configs/protocol_v3.yaml: interface_control_law.frozen_gamma
  note: "Not re-tuned here -- Part 2.2's explicit instruction."
  n_replicates: 20  # matches V3's N_REP

frozen_at_utc: "2026-09-06T00:00:00Z"
frozen_after: "data/dev_sweep.json (dev seeds 2,3,4 only)"
frozen_before: ["data/held_out_evaluation.json", "data/sample_efficiency.json",
                "data/bootstrap_membership.json", "data/control_comparison.json"]
