# PROTOCOL_V3 -- frozen AFTER Part 1's coverage sweep (data/coverage_sweep.json),
# success-model fits (data/success_model_fits.json), minimal-interface search
# (data/minimal_interface.json), and baseline transition-statistics inspection
# (code/analyze_baseline_transition.py console output, transcribed below) --
# all computed on DEVELOPMENT flocks only (seeds 2,3,4,8,9,10,11,13,14,16).
# Frozen BEFORE any held-out-flock (Part 1E) evaluation, BEFORE the staged-
# actuation comparison (Part 2D), and BEFORE the predictive-permeability run
# (Part 3). Do not edit this file after viewing held-out, staged-actuation,
# or predictive-permeability results.

model:  # unchanged from protocol_v1.yaml / protocol_v2.yaml
  nn: 100
  nh: 8
  nu: 4
  vm: 4.0
  ca: 2.0
  fc: 1.0
  beta: 1.0
  precB: 15.0
  precC: 3.0
  alpha: 8.0
  spm_beta: 4.0
  n_iter: 4

spectral:  # unchanged
  TW: 5
  boundary_rule: fixed
  fixed_threshold: 0.05
  core_pctl: [80.0, 20.0]

selection_rule_phase2a:  # unchanged -- used to find every flock's own I0/t0/h0
  nt_search: 60
  eigengap_min: 1.0
  coherence_min: 0.90
  n_min: 10
  n_max: 30
  jaccard_min: 0.6
  stability_steps: 3

task:  # T_u/T_r and the ORIGINAL frozen success/integrity/persistence bars
  # are unchanged from V1/V2 and continue to be reported, unmodified, in
  # every V3 table -- see integrity_v3 below for what is ADDED alongside them.
  T_u: 20
  T_r: 20
  success_threshold_Hstar: 0.8
  integrity_coherence_min: 0.8       # ORIGINAL criterion: every t in [t0,t0+T_u]
  integrity_lineage_min: 0.5
  persistence_threshold_Hstar: 0.5

flock_pool:
  dev_seeds: [2, 3, 4, 8, 9, 10, 11, 13, 14, 16]   # = V2's frozen 10, reused honestly (REFINEMENT_PLAN.md)
  held_out_scan_range: [17, 40]                     # first 6 qualifying, never touched until Part 1E
  held_out_target_n: 6

# --- Part 1: interface-control law, frozen from dev-flock data ---

interface_control_law:
  # Part 1C finding (data/success_model_fits.json, 10,000 dev replicate-level
  # rows): plain Gamma (= frac(m_i>=1)) is actually the WEAKEST single
  # predictor tested (in-sample McFadden R^2=0.379, LOO-holdout logloss
  # 0.4345) -- slightly worse than raw f_A alone (R^2=0.420, logloss 0.4198).
  # mean_m (average actuator-neighbor multiplicity per core bird) alone is
  # the strongest single predictor found (R^2=0.610, logloss 0.274), and
  # frac_m_ge2 (= "double coverage": fraction of I0 with >=2 actuated
  # neighbors) alone (R^2=0.576, logloss 0.294) is close behind and far
  # ahead of plain Gamma. This is NOT the naively expected result (that plain
  # coverage collapses success cleanly) -- reported exactly as found, per the
  # task brief's stopping rules. The refined structural finding: what matters
  # is not merely whether a core bird has *some* actuated neighbor, but
  # whether it has *redundant* (>=2) actuated-neighbor support, consistent
  # with the model's own update rule pooling weighted evidence across all of
  # a bird's neighbors -- a single forced neighbor is one vote among up to 8;
  # noise in the other votes can still swing the outcome.
  chosen_criterion: "q-fold multicover: frac(I0 with m_i(A) >= q) >= gamma"
  q: 2
  # Part 1D (data/minimal_interface.json): for q=2, greedy multicover
  # (code/selection_rules_v3.py:min_actuators_for_multicover) sweeping
  # gamma in {0.5,...,1.0} on the 10 dev flocks (20 replicates/condition,
  # same T_u/T_r/common-random-number convention as V2):
  #   gamma=0.5: mean k=8.6  (mean f_A=0.544)  mean p_success=0.855
  #   gamma=0.6: mean k=12.9 (mean f_A=0.782)  mean p_success=0.990
  #   gamma=0.7: mean k=15.9 (mean f_A=0.935)  mean p_success=0.990
  #   gamma=1.0: mean k=17.0 (mean f_A=1.000)  mean p_success=0.990
  # For comparison, q=1 (plain Gamma) never crosses dev-mean p_success>=0.8
  # until gamma=1.0 itself (i.e. plain single-coverage of the WHOLE core is
  # needed before this weaker criterion predicts success reliably) --
  # concrete confirmation that single coverage is an inferior structural
  # target to double coverage.
  # PRE-REGISTERED rule (REFINEMENT_PLAN.md 1D): freeze the SMALLEST gamma
  # (for the chosen q) whose dev-mean p_success >= 0.8. That is gamma=0.5.
  frozen_gamma: 0.5
  frozen_gamma_dev_mean_p_success: 0.855
  frozen_gamma_dev_mean_k: 8.6
  frozen_gamma_dev_mean_f_A: 0.544
  secondary_reference_gamma_0_6: "kept as a reported reference point (mean f_A=0.78, close to V2's
    0.75-of-shell fraction; dev-mean p_success=0.990) -- NOT substituted for the frozen
    gamma=0.5 choice, which follows the pre-registered first-crossing rule."
  actuator_rule_within_criterion: "greedy multicover order (selection_rules_v3.greedy_multicover_order,
    q=2), i.e. the frozen V3 controller IS the COVER-style greedy rule targeting double coverage --
    not hand-picked bird IDs."

# --- Part 2: transition-aware integrity, frozen from dev-flock coherence
#     trajectories already produced by Part 1 (no new simulation needed) ---

integrity_v3:
  # Baseline transition statistics (code/analyze_baseline_transition.py,
  # n=200 replicate trajectories per condition, pooled over 10 dev flocks x
  # 20 replicates):
  #   full-shell (f_A=1.0):        C_min never below 0.500 (mean 0.531);
  #     recovery to 0.8 (dwell=3) achieved in 100.0% of reps, p90 time=9.1,
  #     max time=17 steps (within T_u=20).
  #   chosen sparse (q=2,gamma=0.5): C_min never below 0.421 (mean 0.526);
  #     recovery to 0.8 (dwell=3) achieved in 99.5% of reps, p90 time=0.0
  #     (bimodal: most reps barely dip), max time=16 steps.
  # These numbers directly motivate the choices below: c_recover=0.8 keeps
  # the SAME numeric bar as the original criterion (the change is WHEN it is
  # checked, not a weaker bar), dwell=3 avoids counting a single noisy
  # instantaneous crossing as "recovered", and T_rec=T_u=20 comfortably
  # covers the observed worst case (17 steps) with margin, without being set
  # equal to the worst case itself (which would be circular).
  c_recover: 0.8
  dwell_steps: 3
  T_rec: 20   # == T_u: recovery must occur (and dwell) by the end of the control window
  c_ref_for_T_low_reporting: 0.6   # secondary diagnostic, reported not gated on
  criterion_definition: >
    A control episode satisfies transition-aware integrity iff: (1) I0
    identity is unchanged, true by construction; (2) H*(t0+T_u) >= 0.8
    (unchanged "success" bar); (3) C_{I0}(t) reaches >= c_recover=0.8 and
    stays there for >= dwell_steps=3 consecutive steps, at some point within
    the first T_rec=20 steps of the control window; (4) H* at t0+T_u+T_r
    (post-release) >= 0.5 (unchanged "persistence" bar).
  original_criterion_status: >
    The ORIGINAL frozen criterion (C_{I0}(t)>=0.8 for EVERY t in
    [t0,t0+T_u]) is retained, unmodified, and reported in every V3 table
    labeled explicitly as "V1/V2 criterion" -- never silently replaced.

staged_actuation:
  # Part 2D: compare Pulse / Ramp-up / Sequential-recruitment / Ramp-down at
  # matched total control-effort budget (k = actuators from the frozen
  # gamma=0.5/q=2 criterion for each of 4 dev flocks: seeds 2,3,8,13 --
  # the same 4 used for Part 3, chosen for shell-size/eigengap diversity,
  # not by any Part 2D outcome).
  flocks: [2, 3, 8, 13]
  n_tranches: 4          # ramp-up / ramp-down tranche count
  n_sector_groups: 8     # sequential-recruitment sector count (matches the
                          # 8-sector concentration-metric partition, Part 1A)
  n_replicates: 30

predictive_permeability:
  # Part 3: extends v1_mechanism_audit/code/predictive_screening.py's
  # one-step methodology to a horizon sweep.
  flocks: [2, 3, 8, 13]
  tau_max: 6
  n_traj: 40
  n_mc: 24
  sample_times_stride: 2
