<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#0f1115;--fg:#e6e6e6;--mut:#8b93a1;--card:#171a21;--acc:#4ea1ff;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#ffb454}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 system-ui,sans-serif}
header{padding:8px 12px;background:var(--card);display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:14px;margin:0}header .m{color:var(--mut)}
button,select,input{background:#222733;color:var(--fg);border:1px solid #333a49;border-radius:4px;padding:3px 8px}
#panels{display:flex;gap:10px;flex-wrap:wrap;padding:10px}
.panel{background:var(--card);border-radius:6px;padding:8px;width:__PW__px}
.panel h2{font-size:12px;margin:0 0 4px;color:var(--mut)}
canvas{background:#0b0d11;border-radius:4px;display:block;max-width:100%}
.badge{display:inline-block;padding:1px 6px;border-radius:9px;font-size:11px;margin-right:4px}
.legend{padding:6px 12px;color:var(--mut);font-size:12px}
.row{display:flex;gap:8px}
</style></head><body>
<header><h1>__TITLE__</h1><span class="m" id="meta"></span>
<button id="play">Play</button><input id="scrub" type="range" min="0" max="0" value="0" style="width:260px">
<span id="tlabel" class="m"></span>
<label>speed <select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label>
<label id="lvlwrap">level <select id="lvl"></select></label></header>
<div id="panels"></div>
<div class="legend" id="legend"></div>
<script>
const DATA=__DATA__;
const EVCOL={SPLIT:'#ff6b6b',MERGE:'#b28dff',EXTRUSION:'#ffb454',ARRIVAL:'#3ecf8e',LOSS:'#ff4fa3',BIRTH:'#4ea1ff',SPLIT_CHILD:'#ff9a9a',END:'#888',END_MERGED:'#aaa'};
const STCOL=['#4ea1ff','#ff9f43','#3ecf8e','#b28dff','#e5e5e5'];
const AXN=['material','count','cohesion','shape','pattern'];
function typeColor(l,ch){const g=n=>{const i=ch.indexOf(n);return i<0?0:Math.max(0,Math.min(1,l[i]))};
 return `rgb(${Math.round(60+195*g('c3'))},${Math.round(60+195*g('c1'))},${Math.round(60+195*g('c2'))})`}
class Panel{
 constructor(root,D,opts){this.D=D;this.o=opts;this.lv=D.levels[0];
  const el=document.createElement('div');el.className='panel';root.appendChild(el);this.el=el;
  el.innerHTML=`<h2>${D.title}</h2><div class="row"><canvas class="arena" width="${opts.aw}" height="${opts.aw}"></canvas>${D.img?`<canvas class="img" width="${opts.aw}" height="${opts.aw}"></canvas>`:''}</div>
  <div class="st"></div><canvas class="tl" width="${opts.aw*(D.img?2:1)+(D.img?8:0)}" height="46"></canvas><canvas class="tr" width="${opts.aw*(D.img?2:1)+(D.img?8:0)}" height="150"></canvas>`;
  this.a=el.querySelector('.arena').getContext('2d');this.i=D.img?el.querySelector('.img').getContext('2d'):null;
  this.tl=el.querySelector('.tl').getContext('2d');this.tr=el.querySelector('.tr').getContext('2d');this.st=el.querySelector('.st');
  // world bounds from all cells at all levels (O1 positions)
  let xs=[],ys=[];for(const f of D.frames){for(const c of f.cells){xs.push(c[0]);ys.push(c[1])}}
  const mx=(Math.min(...xs)+Math.max(...xs))/2,my=(Math.min(...ys)+Math.max(...ys))/2;
  this.sc=opts.aw/(Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))*1.25+4);this.cx=mx;this.cy=my;
  if(D.img){this.imgs=D.img.map(s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)));this.off=document.createElement('canvas');this.off.width=64;this.off.height=64}}
 W(x,y){return[(x-this.cx)*this.sc+this.o.aw/2,this.o.aw/2-(y-this.cy)*this.sc]}
 draw(k){const D=this.D,f=D.frames[k],L=f.lv[this.lv]||f.lv[Object.keys(f.lv)[0]],ctx=this.a,aw=this.o.aw;
  ctx.clearRect(0,0,aw,aw);
  // cells
  for(const c of f.cells){const [x,y]=this.W(c[0],c[1]);ctx.beginPath();ctx.arc(x,y,Math.max(3,this.sc*0.38),0,6.283);
   ctx.fillStyle=typeColor(c.slice(2),D.cellch);ctx.fill();
   if(D.cellch.indexOf('c0')>=0&&c[2+D.cellch.indexOf('c0')]>0.5){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}
   else if(D.cellch.indexOf('c4')>=0){const a=c[2+D.cellch.indexOf('c4')],b=c[2+D.cellch.indexOf('c5')];ctx.strokeStyle=a>b?'#27d3d3':'#e052c4';ctx.lineWidth=1.2;ctx.stroke()}}
  // organisms
  for(const o of L.orgs){const col=STCOL[(o.id)%4];
   if(o.hull){ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();for(const e of o.hull){const p=this.W(e[0],e[1]),q=this.W(e[2],e[3]);ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1])}ctx.stroke()}
   const [cx,cy]=this.W(o.c[0],o.c[1]);ctx.fillStyle=col;ctx.font='bold 12px sans-serif';ctx.fillText('#'+o.id,cx+6,cy-6);
   const e1=o.e1,e2=[-e1[1],e1[0]],Lh=3*this.sc;ctx.globalAlpha=0.25+0.75*o.sc;ctx.strokeStyle='#fff';ctx.lineWidth=2.2;
   const arrow=(v,len,w,dash)=>{ctx.setLineDash(dash?[3,3]:[]);ctx.lineWidth=w;const a=this.W(o.c[0],o.c[1]),b=[a[0]+v[0]*len,a[1]-v[1]*len];ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
     if(!dash){const ang=Math.atan2(-(v[1]),v[0]);ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-7*Math.cos(ang-0.4),b[1]-7*Math.sin(ang-0.4));ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-7*Math.cos(ang+0.4),b[1]-7*Math.sin(ang+0.4));ctx.stroke()}ctx.setLineDash([])};
   arrow(e1,Lh,2.2,false);ctx.strokeStyle='#9aa';arrow(e2,Lh*0.5,1.2,true);ctx.globalAlpha=1}
  // image panel
  if(this.i&&D.img){const im=this.imgs[f.ii];const id=this.off.getContext('2d').createImageData(64,64);
   for(let p=0;p<4096;p++){id.data[p*4]=im[p*3+2];id.data[p*4+1]=im[p*3+1];id.data[p*4+2]=im[p*3];id.data[p*4+3]=255}
   this.off.getContext('2d').putImageData(id,0,0);this.i.imageSmoothingEnabled=false;this.i.drawImage(this.off,0,0,aw,aw);
   const fv=D.fov;const s=aw/(2*fv);const o3=(f.lv.O3b||f.lv.O3a);
   if(o3){for(const o of o3.orgs){this.i.strokeStyle=STCOL[o.id%4];this.i.lineWidth=2;this.i.beginPath();for(const e of (o.hull||[])){this.i.moveTo((e[0]+fv)*s,aw-(e[1]+fv)*s);this.i.lineTo((e[2]+fv)*s,aw-(e[3]+fv)*s)}this.i.stroke();
      this.i.fillStyle='#fff';this.i.font='11px sans-serif';this.i.fillText('#'+o.id,(o.c[0]+fv)*s+4,aw-(o.c[1]+fv)*s-4)}}
   this.i.fillStyle='#ccc';this.i.font='10px sans-serif';this.i.fillText('O3 image (R=c0 G=c2 B=c6) + O3 organism outlines',4,12)}
  // status
  let h='';for(const o of L.orgs){const stc=o.st<0?'#888':STCOL[o.st%4],lab=o.st==-1?'OOD':(o.st==-2?'small':'S'+o.st);
   h+=`<div><b style="color:${STCOL[o.id%4]}">#${o.id}</b> n=${o.n} <span class="badge" style="background:${o.V?'#1f6f4a':'#7a2b2b'}">V ${o.V?'ok':'broken'}</span><span class="badge" style="background:${o.Vc?'#1f6f4a':'#7a2b2b'}">V_cons ${o.Vc?'ok':'broken'}</span>
   <span class="badge" style="background:${stc}22;border:1px solid ${stc}">state ${lab}</span>
   <span style="display:inline-block;width:70px;height:7px;background:#333;vertical-align:middle"><span style="display:block;height:7px;width:${Math.round(70*o.post)}px;background:${stc}"></span></span> ${o.post.toFixed(2)}
   sign ${o.sc.toFixed(2)}${o.unres?' <span class="badge" style="background:#8a6d1a">UNRESOLVED</span>':''}</div>`}
  h+=`<div style="color:var(--mut)">t=${f.t} &nbsp; events now: ${(L.ev.map(e=>e.type+(e.cell>=0&&e.cell!==undefined?'('+e.cell+')':'')).join(', '))||'-'}</div>`;this.st.innerHTML=h;
  this.timeline(k);this.traces(k)}
 timeline(k){const c=this.tl,w=c.canvas.width,D=this.D,n=D.frames.length;c.clearRect(0,0,w,46);c.fillStyle='#889';c.font='10px sans-serif';c.fillText('events ('+this.lv+')',2,10);
  const X=i=>6+(w-12)*i/Math.max(n-1,1);let row={};
  D.frames.forEach((f,i)=>{const L=f.lv[this.lv];if(!L)return;for(const e of L.ev){const r=(row[e.type]=row[e.type]||Object.keys(row).length);c.fillStyle=EVCOL[e.type]||'#fff';c.fillRect(X(i)-1,14+(r%4)*7,3,6)}});
  if(D.onset!==null&&D.onset!==undefined){const io=D.frames.findIndex(f=>f.t>=D.onset);if(io>=0){c.strokeStyle='#ffd24d';c.setLineDash([3,3]);c.beginPath();c.moveTo(X(io),12);c.lineTo(X(io),44);c.stroke();c.setLineDash([]);c.fillStyle='#ffd24d';c.fillText('onset',X(io)+3,44)}}
  c.strokeStyle='#fff';c.beginPath();c.moveTo(X(k),12);c.lineTo(X(k),44);c.stroke()}
 traces(k){const c=this.tr,w=c.canvas.width,D=this.D,n=D.frames.length;c.clearRect(0,0,w,150);const X=i=>6+(w-12)*i/Math.max(n-1,1);
  const panels=[['C1 material J_init',o=>o.j,0,1],['C2 shape/pattern dev / bound',o=>Math.max(o.shr,o.par),0,3],['C3 state posterior',o=>o.post,0,1]];
  const hh=44;panels.forEach((p,pi)=>{const y0=pi*50+4;c.fillStyle='#889';c.font='10px sans-serif';c.fillText(p[0],4,y0+8);
   c.strokeStyle='#2a303c';c.strokeRect(5,y0+10,w-10,hh-10);
   const ids=[...new Set(D.frames.flatMap(f=>(f.lv[this.lv]||{orgs:[]}).orgs.map(o=>o.id)))].slice(0,6);
   ids.forEach(id=>{c.strokeStyle=STCOL[id%4];c.beginPath();let st=false;D.frames.forEach((f,i)=>{const o=(f.lv[this.lv]||{orgs:[]}).orgs.find(o=>o.id===id);if(!o){st=false;return}
     const v=Math.min(p[3],Math.max(p[2],p[1](o)));const y=y0+hh-(v-p[2])/(p[3]-p[2])*(hh-12);if(!st){c.moveTo(X(i),y);st=true}else c.lineTo(X(i),y)});c.stroke()});
   if(pi===1){c.strokeStyle='#ffb45488';const y=y0+hh-(1/3)*(hh-12);c.beginPath();c.moveTo(5,y);c.lineTo(w-5,y);c.stroke()}});
  c.strokeStyle='#fff';c.beginPath();c.moveTo(X(k),0);c.lineTo(X(k),150);c.stroke()}
}
const root=document.getElementById('panels');const panels=DATA.panels.map(D=>new Panel(root,D,{aw:DATA.aw}));
const n=Math.min(...panels.map(p=>p.D.frames.length));const scrub=document.getElementById('scrub');scrub.max=n-1;
const lvl=document.getElementById('lvl');panels[0].D.levels.forEach(l=>{const o=document.createElement('option');o.textContent=l;lvl.appendChild(o)});
lvl.onchange=()=>{panels.forEach(p=>p.lv=lvl.value);show(+scrub.value)};
document.getElementById('meta').textContent=DATA.meta;document.getElementById('legend').innerHTML=DATA.legend;
function show(k){panels.forEach(p=>p.draw(k));document.getElementById('tlabel').textContent=`frame ${k}/${n-1} t=${panels[0].D.frames[k].t}`}
let timer=null,playing=false;const btn=document.getElementById('play');
function tick(){let k=+scrub.value+1;if(k>=n)k=0;scrub.value=k;show(k)}
function restart(){if(timer)clearInterval(timer);if(playing)timer=setInterval(tick,Math.max(30,200/ +document.getElementById('speed').value))}
btn.onclick=()=>{playing=!playing;btn.textContent=playing?'Pause':'Play';restart()};document.getElementById('speed').onchange=restart;
scrub.oninput=()=>show(+scrub.value);
const init=Math.min(n-1,+(DATA.start||0));scrub.value=init;show(init);
</script></body></html>
