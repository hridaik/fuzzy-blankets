, "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"], ["r4", "r1", "r0", "r2", "r7", "r6", "r3", "r5"]]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('rollout-data').textContent);
const IS_AUDIT = true;
const rollouts = DATA.rollouts;
const nBins = Math.max(...rollouts.map(r => r.a_x.length));
document.getElementById('bin-max').textContent = nBins;
document.getElementById('scrubber').max = nBins - 1;

let curBin = 0, playing = false, speedDiv = 1, lastTs = 0;

const panelsDiv = document.getElementById('panels');
const canvases = [];
const tsCanvases = [];
const imgCanvases = [];
rollouts.forEach((r, idx) => {
  const block = document.createElement('div');
  block.className = 'rollout-block';
  let html = '<h3>' + r.label + '</h3>' +
    '<canvas width="320" height="320" id="arena' + idx + '"></canvas>';
  if (r.images) {
    const iw = r.images[0][0].length, ih = r.images[0].length;
    html += '<canvas width="' + iw + '" height="' + ih + '" id="img' + idx +
      '" style="image-rendering:pixelated;width:192px;height:192px;"></canvas>';
  }
  html += '<canvas class="ts-panel" width="320" height="120" id="ts' + idx + '"></canvas>';
  block.innerHTML = html;
  panelsDiv.appendChild(block);
  canvases.push(document.getElementById('arena' + idx));
  tsCanvases.push(document.getElementById('ts' + idx));
  imgCanvases.push(r.images ? document.getElementById('img' + idx) : null);
});

function drawImagePanel(idx, bin) {
  const r = rollouts[idx];
  if (!r.images || !imgCanvases[idx]) return;
  const frames = r.images;
  const fi = Math.min(Math.floor(bin / (r.image_stride || 1)), frames.length - 1);
  const frame = frames[fi];  // [H][W][C] uint8, C=4 (O3a) or 2 (O3b)
  const H = frame.length, W = frame[0].length, C = frame[0][0].length;
  const cv = imgCanvases[idx];
  const ctx = cv.getContext('2d');
  const imgData = ctx.createImageData(W, H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const px = frame[y][x];
      const o = (y * W + x) * 4;
      imgData.data[o] = C >= 1 ? px[0] : 0;
      imgData.data[o + 1] = C >= 2 ? px[1] : 0;
      imgData.data[o + 2] = C >= 3 ? px[2] : 0;
      imgData.data[o + 3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function cellColor(sig234) {
  const r = Math.max(0, Math.min(1, sig234[0]));
  const g = Math.max(0, Math.min(1, sig234[1]));
  const b = Math.max(0, Math.min(1, sig234[2]));
  return 'rgb(' + Math.round(r*255) + ',' + Math.round(g*255) + ',' + Math.round(b*255) + ')';
}

function drawArena(idx, bin) {
  const r = rollouts[idx];
  const b = Math.min(bin, r.a_x.length - 1);
  const cv = canvases[idx];
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,cv.width,cv.height);
  const scale = 40, cx = cv.width/2, cy = cv.height/2;

  if (document.getElementById('heatmap').checked && r.ligand) {
    const sigIdx = parseInt(document.getElementById('heatmap-sig').value);
    const grid = r.ligand[b][sigIdx];
    const gN = Math.round(Math.sqrt(grid.length));
    const cell = cv.width / gN;
    let maxv = 1e-6;
    for (const v of grid) if (v > maxv) maxv = v;
    for (let i=0;i<grid.length;i++) {
      const gx = i % gN, gy = Math.floor(i / gN);
      const v = Math.max(0, Math.min(1, grid[i]/maxv));
      ctx.fillStyle = 'rgba(255,' + Math.round(255*(1-v)) + ',0,' + (0.5*v) + ')';
      ctx.fillRect(gx*cell, gy*cell, cell, cell);
    }
  }

  if (document.getElementById('trails').checked) {
    ctx.strokeStyle = 'rgba(150,150,150,0.3)';
    const nCells = r.a_x[0][0].length;
    for (let c=0; c<nCells; c++) {
      ctx.beginPath();
      for (let t=0; t<=b; t++) {
        const x = cx + r.a_x[t][0][c]*scale, y = cy + r.a_x[t][1][c]*scale;
        if (t===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
  }

  if (IS_AUDIT && r.target_x) {
    ctx.strokeStyle = '#888';
    for (let c=0; c<r.target_x[0].length; c++) {
      const x = cx + r.target_x[0][c]*scale, y = cy + r.target_x[1][c]*scale;
      ctx.beginPath();
      for (let k=0;k<5;k++) {
        const ang = Math.PI/2 + k*2*Math.PI/5;
        const px = x + 6*Math.cos(ang), py = y - 6*Math.sin(ang);
        if (k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.stroke();
    }
  }

  const nCells = r.a_x[b][0].length;
  for (let c=0; c<nCells; c++) {
    const x = cx + r.a_x[b][0][c]*scale, y = cy + r.a_x[b][1][c]*scale;
    const s = r.a_s[b];
    const sig234 = [s[1][c], s[2][c], s[3][c]];
    ctx.fillStyle = cellColor(sig234);
    ctx.beginPath(); ctx.arc(x, y, 6, 0, 2*Math.PI); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth=0.5; ctx.stroke();
  }

  if (r.caption) {
    ctx.fillStyle = '#ccc'; ctx.font = '11px sans-serif';
    ctx.fillText(r.caption[Math.min(b, r.caption.length-1)], 6, 14);
  }
  if (IS_AUDIT && r.arrows) {
    const A = Array.isArray(r.arrows[0][0]) && Array.isArray(r.arrows[0][0][0]) ? r.arrows[Math.min(b, r.arrows.length-1)] : r.arrows;
    ctx.strokeStyle = '#ff6'; ctx.lineWidth = 1.5;
    for (let c=0; c<A.length; c++) {
      const x = cx + r.a_x[b][0][c]*scale, y = cy + r.a_x[b][1][c]*scale;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x + A[c][0]*scale, y + A[c][1]*scale); ctx.stroke();
    }
    ctx.lineWidth = 1;
  }
  if (IS_AUDIT && r.labels) {
    const Lb = r.labels[Math.min(b, r.labels.length-1)];
    ctx.fillStyle = '#9f9'; ctx.font = '11px sans-serif';
    for (let c=0; c<Lb.length; c++) {
      const x = cx + r.a_x[b][0][c]*scale, y = cy + r.a_x[b][1][c]*scale;
      ctx.fillText(Lb[c], x+8, y-7);
    }
  }
}

function drawTimeSeries(idx, bin) {
  const r = rollouts[idx];
  const cv = tsCanvases[idx];
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,cv.width,cv.height);
  const nT = r.a_x.length;
  const nCells = r.a_x[0][0].length;
  ctx.strokeStyle = '#4af'; ctx.beginPath();
  for (let t=0;t<nT;t++) {
    let sec = 0;
    for (let c=0;c<nCells;c++) { for (let ch=0; ch<4; ch++) sec += r.a_s[t][ch][c]; }
    sec /= (nCells*4);
    const x = t/(nT-1)*cv.width, y = cv.height - sec*cv.height*0.4 - 10;
    if (t===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.strokeStyle = '#fa4'; ctx.beginPath();
  for (let t=1;t<nT;t++) {
    let spd = 0;
    for (let c=0;c<nCells;c++) {
      const dx = r.a_x[t][0][c]-r.a_x[t-1][0][c], dy = r.a_x[t][1][c]-r.a_x[t-1][1][c];
      spd += Math.sqrt(dx*dx+dy*dy);
    }
    spd /= nCells;
    const x = t/(nT-1)*cv.width, y = cv.height - spd*cv.height*4 - 10;
    if (t===1) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  const cx = Math.min(bin, nT-1)/(nT-1)*cv.width;
  ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,cv.height); ctx.stroke();
  ctx.fillStyle='#4af'; ctx.font='10px sans-serif'; ctx.fillText('secretion (mean)', 4, 12);
  ctx.fillStyle='#fa4'; ctx.fillText('speed (mean)', 4, 24);
}

function render() {
  document.getElementById('bin-label').textContent = curBin+1;
  document.getElementById('scrubber').value = curBin;
  rollouts.forEach((r, idx) => { drawArena(idx, curBin); drawTimeSeries(idx, curBin); drawImagePanel(idx, curBin); });
}

document.getElementById('scrubber').addEventListener('input', (e) => { curBin = parseInt(e.target.value); render(); });
document.getElementById('stepfwd').addEventListener('click', () => { curBin = Math.min(nBins-1, curBin+1); render(); });
document.getElementById('stepback').addEventListener('click', () => { curBin = Math.max(0, curBin-1); render(); });
document.getElementById('trails').addEventListener('change', render);
document.getElementById('heatmap').addEventListener('change', render);
document.getElementById('heatmap-sig').addEventListener('change', render);
document.getElementById('speed').addEventListener('change', (e) => { speedDiv = parseFloat(e.target.value); });
document.getElementById('playpause').addEventListener('click', (e) => {
  playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play';
  if (playing) requestAnimationFrame(tick);
});
function tick(ts) {
  if (!playing) return;
  if (ts - lastTs > 100*speedDiv) { curBin = (curBin+1) % nBins; render(); lastTs = ts; }
  requestAnimationFrame(tick);
}
render();
</script>
</body>
